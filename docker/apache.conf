<VirtualHost *:${PORT}>
    DocumentRoot ${APACHE_DOCUMENT_ROOT}

    <Directory ${APACHE_DOCUMENT_ROOT}>
        AllowOverride None
        Require all granted
        Options -Indexes
        # Static files (studio.html) are served directly; everything else,
        # including /order-messages.js, goes to the front controller.
        FallbackResource /index.php
    </Directory>

    # The studio app is a static page; keep it from being framed by other sites.
    <Files "studio.html">
        Header always set X-Frame-Options "DENY"
        Header always set Cache-Control "no-cache"
    </Files>

    # mod_php does not always expose the Authorization header to PHP.
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
