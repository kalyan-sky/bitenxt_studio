expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 256M
max_execution_time = 300
; Cloud Run accepts requests up to 32 MB, so one message (text + files) must fit in that.
file_uploads = On
post_max_size = 32M
upload_max_filesize = 25M
max_file_uploads = 5
opcache.enable = 1
opcache.validate_timestamps = 0
