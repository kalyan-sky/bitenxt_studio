# Cloud Run environment for BiteNXT Studio messaging.
# Copy to deploy/env.yaml (git-ignored) and edit. The database password is NOT set here:
# it comes from Secret Manager (secret "studio-db-password", see cloudrun-deploy.sh).

MAGENTO_GRAPHQL_URL: "https://uat-magento.bitenxt.com/graphql"

# --- Database (MySQL) ---
# Option A - a new database on the MySQL server Magento already uses (no extra cost), reachable from Cloud Run:
#   DATABASE_DSN: "mysql:host=10.0.0.5;port=3306;dbname=bitenxt_studio;charset=utf8mb4"
# Option B - Cloud SQL for MySQL (set CLOUDSQL_INSTANCE when running the deploy script):
#   DATABASE_DSN: "mysql:unix_socket=/cloudsql/PROJECT:REGION:INSTANCE;dbname=bitenxt_studio;charset=utf8mb4"
# Tables are created automatically on the first request.
DATABASE_DSN: ""
DATABASE_USER: "bitenxt_studio"

# Pro frontend(s) that open the order messages panel / the chatbot that calls /api (scheme + host, comma-separated).
ALLOWED_ORIGINS: "https://uat-pro.bitenxt.com"

# Only if the studio frontend is a separate site calling /studio/api directly.
# Not needed when the team uses the built-in studio app at <service URL>/studio.html.
STUDIO_ALLOWED_ORIGINS: ""

# Public URL of this service (used for "Open" links in notifications). Fill in after the first deploy.
STUDIO_URL: ""

# Optional: Slack / Teams / Google Chat incoming webhook. Every customer message posts here.
STUDIO_WEBHOOK_URL: ""

# Attachments
MAX_FILE_MB: "25"                 # per file; one message (all files) must stay under Cloud Run's 32 MB request limit
MAX_FILES_PER_MESSAGE: "5"
ALLOWED_FILE_EXTENSIONS: "stl,ply,obj,dcm,zip,7z,pdf,jpg,jpeg,png,heic,webp,txt"

MAX_MESSAGE_CHARS: "4000"
CUSTOMER_MESSAGES_PER_MINUTE: "10"
STUDIO_SESSION_HOURS: "12"

# 1 when traffic reaches Cloud Run directly (*.run.app or a domain mapping); 2 behind an external load balancer.
TRUSTED_PROXY_HOPS: "1"
